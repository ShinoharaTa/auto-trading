# コピーして config.toml を作る（config.toml は git 管理外）
# APIキーは「資産参照」「取引」のみ。出金(withdraw)権限は付けないこと。

[data]
pair = "btc_jpy"        # 単発バックテスト等の既定ペア
# ペア別チューニング/運用の対象。各ペアは独立した設定を持つ（state/pair_settings.json）
pairs = ["btc_jpy", "eth_jpy", "xrp_jpy", "ltc_jpy"]
db_path = "data/candles.sqlite"
# 取得開始日(YYYYMMDD)。空なら fetch.py のデフォルトに従う
start_date = "20240101"

[api]
# 本番運用でのみ使用。バックテストでは不要。
# 値は環境変数から読む想定: BITBANK_API_KEY / BITBANK_API_SECRET
key_env = "BITBANK_API_KEY"
secret_env = "BITBANK_API_SECRET"

# ===== ペーパートレード（実発注なし・仮想）=====
[paper]
db_path = "state/paper.sqlite"
poll_seconds = 60
# Discord Webhook は環境変数 DISCORD_WEBHOOK_URL に設定する（ここには書かない）

# A: 4hトレンド・成行(taker)・各¥100k。60日窓比較で 1h より安定（#12）
[[paper.accounts]]
name = "A_trend"
strategy = "sma_cross"
order_type = "taker"
timeframe = "4h"
pairs = ["btc_jpy", "eth_jpy"]
base_jpy = 100000
params = { fast = 20, slow = 60, atr_stop_mult = 5.0, risk_per_trade = 0.01 }

# B: 5m RSI逆張り・指値(maker)・¥100k。指値の実約定率を実測する
[[paper.accounts]]
name = "B_intraday"
strategy = "rsi"
order_type = "maker"
timeframe = "5m"
pairs = ["btc_jpy"]
base_jpy = 100000
params = { rsi_period = 14, rsi_entry = 30, rsi_exit = 55, atr_stop_mult = 2.5, risk_per_trade = 0.01 }

# C: 1d トレンドフィルタ・成行(taker)・¥100k。SMA20>SMA60 の間だけ全額保有、割れたら全額現金。
# 損切りなし（atr_stop_mult = 0）。長期運用候補（12か月積立比較で元本超え82%・年3回売買、#21）
[[paper.accounts]]
name = "C_trend_1d"
strategy = "sma_cross"
order_type = "taker"
timeframe = "1d"
pairs = ["btc_jpy"]
base_jpy = 100000
params = { fast = 20, slow = 60, atr_stop_mult = 0, risk_per_trade = 1.0, max_position_frac = 1.0 }
